name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      # base must match the repo name for a project page
      # (https://<user>.github.io/<repo>/). A user/org page needs BASE_PATH=/.
      # Vite inlines VITE_* at build time. CI has no .env, so these must come
      # from repo secrets or the deployed site ships with no Supabase config
      # and every account/checkout page reports "Accounts unavailable".
      - name: Build
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY secrets are missing."
            echo "Without them the site deploys with sign-in and checkout disabled."
            exit 1
          fi
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Lets build-catalog.mjs merge store decoration (banner/logo/blurb)
          # into the baked catalog. Same values as the stock-sync step below;
          # the secret key is used by the build script only, never bundled.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      # Catches a bundle built without Supabase config, or one that leaked a
      # secret — both silent failures that only show up on the live site.
      - name: Check the built bundle
        run: npm run test:build

      - name: SPA fallback
        # GitHub Pages 404s unknown paths; serving index.html keeps deep links working.
        run: cp dist/index.html dist/404.html

      # The database is the authority on stock at checkout, so it must match
      # the catalog being published. Uses the SECRET key — never in the bundle.
      - name: Sync stock to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::warning::SUPABASE_SECRET_KEY not set — skipping stock sync."
            echo "Checkout will use whatever totals are already in the database."
            exit 0
          fi
          node scripts/sync-stock.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
